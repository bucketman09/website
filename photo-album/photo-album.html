<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects</title>

    <style>
        body{
            background-image: url("../assets/desk_background.webp");
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: rgba(98, 98, 98); 
            overflow: hidden;

            display: flex;
            justify-content: center; /* horizontal center */
            align-items: center;

            min-height: 100vh;
            margin: 0px;

            
        }

        #navigation{
            width: 400px;
            height: 600px;
            background-image: url("../assets/notepad_transparent.webp");
            background-position: center;
            background-size: contain; 
            background-repeat: no-repeat;
            font-family: myFont;

            display: grid;
            grid-template-columns: repeat(2,1fr);
            grid-template-rows: repeat(3,1fr);

        }

        #nav-right{
            width: 400px;
            height: 600px;
            background-image: url("../assets/notepad_transparent.webp");
            background-position: center;
            background-size: contain; 
            background-repeat: no-repeat;
            font-family: myFont;

            display: grid;
            grid-template-columns: repeat(2,1fr);
            grid-template-rows: repeat(3,1fr);
        }

        .text{
            margin-left: 15px;
            line-height: 34px;
        }

        .subText{
            margin-left: 30px;
            line-height: 34px;
        }
        

        #fullScreenDiv{
            display: none;
            position: absolute;
            z-index: 9999;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-size: contain;
            background-repeat: no-repeat no-repeat;
            background-position: center center;
        }

        @font-face {
            font-family: myFont; /* set name */
            src: url(../assets/cheese_milky/Cheese\ Milky.otf); /* url of the font */
        }


    </style>
</head>
