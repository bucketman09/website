<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
    <style>
        *{
            font-family: myFont;
            font-family: cursive;
            box-sizing: border-box;
        }

        body{
            background-image: url(assets/librarybackground.jpg);
            background-repeat: no-repeat;
            background-size: cover;
            background-attachment: fixed;

            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: row;
            justify-content: center;
            flex-wrap: wrap;
            position:absolute;

            gap: 2%;

            overflow: hidden;

            padding: 5% 2% 5%;
        }

        /*main box -----------------------------------------------*/

        #pages{
            position: relative;
            width: 50%;
            height: 100%;

            background-image: url("assets/rug_19622.webp");
            background-repeat: repeat;
            background-position: center;

            background-color: rgba(0, 77, 0, 0.487);
            border: 5px solid black;
            overflow: scroll;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content:start;

            gap: 2%;
        }

        #pages > h1{
            background-color: green;
        }

        #shelf{
            position: relative;
            width: 350px;
            height: 450px;

            background-image: url("assets/bookshelf_closed.webp");
            background-position: center;
            background-repeat: no-repeat;
            background-size: contain;

            display: grid;
            padding-top: 50px;
            padding-left: 25px;
            grid-template-columns: repeat(2, 140px);
            grid-template-rows: 60px 60px 60px 60px 100px;
            

            column-gap: 20px;
            row-gap: 5px;

            align-items: center;
            
        }

        #shelf > a{
            background-color: green;
        }

        /*doors -----------------------------------------------*/

        #left_door{
            height: 100%;
            opacity: 0;
        }

        #left_door:hover{
            opacity: 1;
        }

        #shelf:has(#left_door:hover) {
            background-image: url("assets/bookshelf_left.webp");
            
        }

        #right_door{
            height: 100%;
            opacity: 0;
        }

        #righ_door:hover{
            opacity: 1;
        }

        #shelf:has(#right_door:hover) {
            background-image: url("assets/bookshelf_right.webp");
        }

        #updates{
            width: 80%;
            border: 5px dashed black;
            padding: 2%;

            color: white;
            
        }

        #updates > a{
            color: white;
        }

        
            

        /*side box -----------------------------------------------*/

        #side{
            width: 25%;
            height: 100%;
            display: flex;
            flex-direction: column;

            gap: 2%;

        }

        #card{
            position: relative;
            width: 100%;
            height: 35%;

            background-color: rgb(0, 71, 0);
            border: 5px solid black;

            padding: 2%;
        }

        #featured{
            position: relative;
            width: 100%;
            height: 65%;  
            
            background-image: url(assets/notepad_transparent.webp);
            background-repeat: no-repeat;
            background-size: cover;

            padding: 2%;
            padding-left: 5%;

            display: flex;
            flex-direction: column;
            align-self: center;
            gap: 2%;
        }

        #featured_content{
            display: flex;
            flex-direction: column;
        }

        #banana{
            transform: scale(.10);
            transform-origin: top left;
        }

        /*general*/

        p,a{
            margin:0px;
        }
        
        
        @media screen and (max-width: 700px) {
            body{
                justify-content: space-around;
                overflow-y: scroll;
                overflow-x: hidden;
            }

            
            #pages{
                width: 95%;
            }

            #side{
                width: 95%;
            }

            
        }
            
        
    </style>

    

    <script>
        let player = null;
        function togglePopup() {
            if(player == null || player.closed){
                player = window.open(
                    "music_player.html",
                    "Player",
                    "width=300,height=350",
                    "resziable=no"
                );
            }else{
                console.log("close");
                player.close();
                player = null;
            }
        }

        
        function playSFX(id){
            const sfx_hash = {
                        "banana": "assets/sfx/Donkey Kong 64 (Oh Banana!) Full HD.mp3", 
                        "door_open": "assets/sfx/door_open.wav", 
                        "door_close": "assets/sfx/door_close.wav"
                        };

            var sfx = new Audio(sfx_hash[id]);
            sfx.play();
            
        }

    </script>
</head>

<body>
    <div id="pages" class="draggable">
        <h1>Welcome to Nathan's Library </h1>
        <div id="shelf">
            <a href="photos/photos.html">Photo Albums</a>
            <a href="media_logs/media_logs.html">Media Logs</a>
            <a href="projects/projects.html">Projects</a>
            <a href="collections/collections.html">Collections</a>
            <a href="">4</a>
            <a href="">5</a>
            <a href="">6</a>
            <a href="">7</a>
            <div id="left_door">
                 <img id="banana" src="assets/spinning-banana-banana.gif" alt="Oh Banana" onclick="playSFX('banana')">  
            </div>
            <div id="right_door">

            </div>
        </div>
        <div id="updates">
            <h2>Updates</h2>
            
        </div>
        
    </div>

    <div id="side">
        <div id="card" class="draggable">
            
        </div>

        <div id="featured" class="draggable">
            <h1>Featured</h1>
            <div id="featured_content">
                <button id="toggle_player" onclick="togglePopup()">Toggle Music Player</button>
                <a href="wishlist/wishlist_simple.html">2026 Birthday Wish List</a>
            </div>
            
        </div>

    </div>

    <script src = "scripts.js"></script>
    
</body>
</html>
