<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <title>MyLibrary</title>

    <link rel="preload" as="image" href="assets/bookshelf_empty_open_transparent.webp">

    <style> 
        body { 
            overflow: hidden;
            
            background-color: rgb(1, 67, 8);
            background-image: url("assets/librarybackground.jpg");
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;

            display: flex;
            justify-content: center;
            align-items: center;
            }
        

        #mainbox{
            width: 600px;
            height: 700px;
            background-image: url(assets/bookshelf_empty_closed_transparent.webp);
            /*border: 5px solid black;*/
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            padding-top: 40px;
            padding-left: 50px;
            padding-right:50px;
            padding-bottom: 100px;

            display: grid;
            column-gap: 15px;
            row-gap: 10px;
            grid-template-columns: repeat(2,1fr);
            grid-template-rows: repeat(5,1fr);
            justify-self: baseline;
            align-items: baseline;
            
            
        }

        .cell {
            width: 100%;
            height: 100%;
        }

        @font-face {
            font-family: myFont; /* set name */
            src: url(assets/minecraftia/Minecraftia-Regular.ttf); /* url of the font */
        }
        
        .text{
            color: black;
        }

    </style>
    
</head>

<body> 
    <!--video id="book-video" autoplay src="assets/book-animation-transparent.webm"></video-->
        
    
    <audio id="musicPlayer"></audio>
    <script>
    const music = ["assets/music/Geese-3D Country-Crusades.mp3",
                    "assets/music/Miles Davis-Miles Ahead-Springsville.mp3"
                    ]
   
    let random = Math.floor(Math.random() * music.length);

    musicPlayer.src = music[random];
    musicPlayer.load();

    function stopStart(){
            if(musicPlayer.paused){
                musicPlayer.play()
            }else{
                musicPlayer.pause()
            }
        }
    
    </script>

    
    <audio id="openSFX" src="assets/sfx/door_open.wav"></audio>
    <audio id="closeSFX" src="assets/sfx/door_close.wav"></audio>
    <script>
        function playSFX(x){
            if(x==0){
                openSFX.play()
            }else{
                closeSFX.play()
            }
        }
    </script>

    <div id="mainbox">
        <div class="cell" data-cell="0"></div>
        <div class="cell" data-cell="1"></div>
        <div class="cell" data-cell="2"></div>
        <div class="cell" data-cell="3" ></div>
        <div class="cell" data-cell="4"></div>
        <div class="cell" data-cell="5"></div> 
        <div class="cell" data-cell="6">
            <img src="assets/cd-player-stereo.gif" alt="cd_player" onclick="stopStart()">
        </div>
        <div class="cell" data-cell="7"></div>
        <div class="cell" data-cell="8"></div>
        <div class="cell" data-cell="9"></div>

    </div>
    <script>
        document.getElementById("mainbox").addEventListener("click", (e) => {  
            let c = e.target.closest(".cell").dataset.cell;
            
            console.log(c);
                if(c==0){
                    console.log("click!")
                    window.location.href = "projects/projects.html";
                }else if (c==1){
                    window.location.href = "photo-album/photo-album.html"
                }
            }); 
            
        document.getElementById("mainbox").addEventListener("mouseover", (e) => {
            //console.log("mouse!")
            const cell = e.target.closest(".cell");
            
            if (!cell) return;

            let c = cell.dataset.cell;
            

            if(c == 8 || c == 9 ){
                console.log("open");
                document.getElementById("mainbox").style.backgroundImage = 'url("assets/bookshelf_empty_open_transparent.webp")'
                playSFX(0)

            }else{
                document.getElementById("mainbox").style.backgroundImage = 'url("assets/bookshelf_empty_closed_transparent.webp")'
                playSFX(1)
            }
            //cell.style.backgroundColor = "red";
        });
    </script>
