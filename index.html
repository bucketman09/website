    <style>
        *{
            font-family: myFont;
            box-sizing: border-box;
        }

        body{
            background-image: url("assets/desk_background.webp");
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: rgba(98, 98, 98); 
            overflow: hidden;


            display: flex;
            justify-content: center; /* horizontal center */
            align-items: center;

            min-height: 100vh;
            margin: 0px;

            
        }

        #navigation{
            width: 400px;
            height: 600px;

            position: relative;
            left:0px;
            transition: left 0.5s ease;

            background-image: url("assets/notepad_transparent.webp");
            background-position: center;
            background-size: contain; 
            background-repeat: no-repeat;

            padding-left: 20px;

            display: flex;
            flex-direction: column;
            position: relative;

        }

        /*

        */

        a{
            line-height: 34px;
        }

        .subText{
            margin-left: 30px;
        }

        
        
        #note{ 
            z-index: 10;
            width: 200px;
            height: 200px;
            background-position: center;
            background-repeat: no-repeat;
            background-size: contain;
            /*border: 5px solid black;*/
            top: 5%;
            left: 75%;
            transform: rotate(5deg);
            position: absolute;
            background-image: url(/assets/stickynote.webp);

            padding: 20px;

        }

    </style>
<head>


<body>
    <audio id="musicPlayer"></audio>
    <script>
    const music = ["assets/music/Geese-3D Country-Crusades.mp3",
                    "assets/music/Miles Davis-Miles Ahead-Springsville.mp3"
                    ]
   
    let random = Math.floor(Math.random() * music.length);

    musicPlayer.src = music[random];
    musicPlayer.load();

    function stopStart(){
            if(musicPlayer.paused){
                musicPlayer.play()
            }else{
                musicPlayer.pause()
            }
        }
    
    </script>
    <div id="note">
        <img src="/assets/cd-player-stereo.gif" alt="music">
        <p onclick="stopStart()">Play</p>
    </div>
    <div id="navigation">
        <h1 style="margin-top: 50px; margin-bottom: 0px;">Index</h1>

        <a href="projects/projects.html"/*onclick="moveElement()"*/ id="projects">Projects</a>

        <a href="catalog/catalog.html"> Catalog</a>
                
        <a class="subText"; href="">Books</a>
            
        <a class="subText"; href="">Film & TV</a>
                
        <a class="subText"; href="">Games</a>
            
        <a href="photo-album/photo-album.html">Photos</a>
        
    </div>

    <script>
        var id = null;
        document.querySelectorAll("a").forEach(link => {
            link.addEventListener("click", function(e) {
                e.preventDefault()
                console.log("Link clicked:", this.href);
                var elem = document.getElementById("navigation");
                elem.style.left = "110%";
                
                setTimeout(go=> {window.location.href = link;}, 500)
