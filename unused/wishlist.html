<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects</title>
    <link rel="stylesheet" href="../css/font.css">
    <style>
        *{
            font-family: myFont;
        }
        body{
            background-image: url("../assets/desk_background.webp");
            overflow: hidden;

            display: flex;
            align-items: center;
            justify-content: center;

            min-height: 100vh;

        }

        #pageLeft{
            background-image: url("../assets/notepad_transparent.webp");
            width: 30vw;
            height: 75vh;
            
            background-position: center;
            background-size: cover; 
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
        

            padding: 15px;
            
            box-sizing: border-box;
        }

        #pageRight{
            background-image: url("../assets/notepad_transparent.webp");
            width: 30vw;
            height: 75vh;
            
            background-position: center;
            background-size: cover; 
            background-repeat: no-repeat;
            font-family: myFont;
            display: flex;
            flex-direction: column;

            padding: 15px;
            
            box-sizing: border-box;
        }

        .header{
            width: 100%;
            height: 15%;

            box-sizing: border-box;
        }

        .content{
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            flex-grow:1;

        }

        .slot{
            position: relative;
            display: flex;
            box-sizing: border-box;
            justify-content: space-around;
            align-items: center;
            height: auto;
            border:black solid 5px;

            flex-grow:1;

        }

        .img{
            margin:2%;
            width: 22%;
        }

        h{
            width: 100%;
            height: 15%;

            box-sizing: border-box; 
        }

        .pageturnbtn{
            width:50px;
            height:50px;
            background-color: blue;
        }

    </style>
<head>

<body>
    <div id="pageLeft">
        <h2>Page Left</h2>
        <div class="content">
            <div class="slot">
                <img src="https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Fwww.pointekonline.com%2Fwp-content%2Fuploads%2F2022%2F10%2Fapple-watch-ultra.jpeg&f=1&nofb=1&ipt=f2ff175f5eec82b0c13091ccfc67fad1a6a52c8bddae8f33900a8c93efb1e31a" alt="Cow" class="img">
                <p>Time and Date</p>
            </div>
            <div class="slot">
                <img src="" alt="Cow" class="img">
                <p>Time and Date</p>
            </div>
            <div class="slot">
                <img src="" alt="Cow" class="img">
                <p>Time and Date</p>
            </div>
        </div>
        <div class="pageturnbtn">PT</div>
    </div>

    <div id="pageRight">
        <h2>Page Right</h2>
        <div class="content">
            <div class="slot">
                <img src="" alt="Cow" class="img">
                <p>Time and Date</p>
            </div>
            <div class="slot">
                <img src="" alt="Not Cow" class="img">
                <p>Time and Date</p>
            </div>
            <div class="slot">
                <img src="" alt="Cow" class="img">
                <p>Time and Date</p>
            </div>
        </div>
    </div>
    
</body>
